name: Build and Release

# Push a vX.Y.Z tag: the binaries for Windows, Linux and macOS (Intel and
# Apple Silicon) are built on stable Rust and attached to the GitHub release.
# Running the workflow by hand builds the four binaries without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            # macos-latest is Apple Silicon; it cross-compiles to Intel
            # (the macos-13 Intel runners queue for hours on the free tier).
            os: macos-latest
            mac_arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            mac_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/caarea.exe caarea-${{ github.ref_name }}-windows.exe

      - name: Rename binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/${{ matrix.target }}/release/caarea caarea-${{ github.ref_name }}-linux
          chmod +x caarea-${{ github.ref_name }}-linux

      - name: Rename binary (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cp target/${{ matrix.target }}/release/caarea caarea-${{ github.ref_name }}-macos-${{ matrix.mac_arch }}
          chmod +x caarea-${{ github.ref_name }}-macos-${{ matrix.mac_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caarea-${{ matrix.target }}
          path: caarea-${{ github.ref_name }}*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: caarea-*
