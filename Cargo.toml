[package]
name = "caarea"
version = "0.1.0"
edition = "2021"

[dependencies]
evtx = "0.8.4"  # Última versión estable
polars = { version = "0.36", features = ["lazy", "parquet", "json"] }  # Para manejar DataFrames
rayon = "1.8"  # Para procesamiento paralelo
serde = { version = "1.0", features = ["derive"] }  # Para manejar JSON
quick-xml = "0.31"  # Para parsear XML
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"   # Asegúrate de usar la última versión disponible
chrono = "0.4"
sootmark_registry = { package = "sootmark-registry", version = "0.7.0" }
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.3"
ewf = "0.4"
ntfs = "0.4"
mbrman = "0.6"
vshadow = "0.2"
regex = "1.10"
