[package]
name = "caarea"
version = "0.2.0"
edition = "2021"
description = "CAAREA - Chronological Artifacts & Activity Reconstruction Engine for Analysis (native Rust DFIR execution timeliner)"

[dependencies]
evtx = "0.8.4"
rayon = "1.8"
quick-xml = "0.31"
clap = "4.4"
serde_json = "1.0"
indicatif = "0.17"
chrono = "0.4"
chrono-tz = "0.9"
sootmark_registry = { package = "sootmark-registry", version = "0.7.0" }
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.3"
ewf = "0.4"
ntfs = "0.4"
mbrman = "0.6"
vshadow = "0.2"
regex = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
