<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="CAAREA: a timeline of executions passing through a chronometer ring, one process tree branching from it, one node lit">
  <defs>
    <radialGradient id="sky" cx="0.38" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#141c30"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="emberV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff5c6c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- warm haze behind the ring -->
  <circle cx="300" cy="205" r="150" fill="#ff7a45" fill-opacity="0.16" filter="url(#haze)"/>

  <!-- faint grid of the timeline: seconds -->
  <g stroke="#2a3550" stroke-width="1">
    <path d="M60 205 H840" stroke-opacity="0"/>
    <g stroke-opacity="0.7">
      <path d="M90 196 V214"/><path d="M130 199 V211"/><path d="M170 199 V211"/><path d="M210 199 V211"/>
      <path d="M390 199 V211"/><path d="M430 199 V211"/><path d="M470 199 V211"/>
      <path d="M560 199 V211"/><path d="M640 199 V211"/><path d="M680 199 V211"/><path d="M720 199 V211"/><path d="M760 199 V211"/><path d="M800 199 V211"/>
    </g>
  </g>

  <!-- the chronometer ring: a C, open where the timeline leaves it -->
  <g fill="none" stroke-linecap="round">
    <circle cx="300" cy="205" r="138" stroke="#1f2a44" stroke-width="14"/>
    <path d="M419.5 136 A138 138 0 1 0 419.5 274" stroke="url(#ring)" stroke-width="14" filter="url(#softglow)"/>
    <!-- hour ticks -->
    <g stroke="#55637f" stroke-width="3">
      <path d="M300 86 V98"/><path d="M300 312 V324"/><path d="M181 205 H193"/>
      <path d="M240.5 102 l6 10.4"/><path d="M196.9 145.5 l10.4 6"/><path d="M196.9 264.5 l10.4 -6"/><path d="M240.5 308 l6 -10.4"/>
      <path d="M359.5 102 l-6 10.4"/><path d="M359.5 308 l-6 -10.4"/>
    </g>
    <!-- the hand: points at the event in the centre -->
    <path d="M300 205 L236 142" stroke="#8fa0bf" stroke-width="4"/>
    <path d="M300 205 L300 121" stroke="#c7d2e6" stroke-width="3"/>
  </g>

  <!-- the timeline -->
  <path d="M40 205 H860" stroke="#6f7f9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 205 H300" stroke="url(#ember)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- events before: faint, resolved -->
  <g fill="#c9d3e6" filter="url(#softglow)">
    <circle cx="100" cy="205" r="5"/>
    <circle cx="150" cy="205" r="4"/>
    <circle cx="225" cy="205" r="6"/>
  </g>
  <!-- the event under the hand -->
  <circle cx="300" cy="205" r="17" fill="#ff8a4c" fill-opacity="0.35" filter="url(#haze)"/>
  <circle cx="300" cy="205" r="10" fill="url(#emberV)" filter="url(#glow)"/>
  <circle cx="300" cy="205" r="4" fill="#fff6e8"/>

  <!-- events after -->
  <g fill="#e6ecf7" filter="url(#softglow)">
    <circle cx="372" cy="205" r="5"/>
    <circle cx="520" cy="205" r="7"/>
    <circle cx="600" cy="205" r="4.5"/>
    <circle cx="700" cy="205" r="5"/>
    <circle cx="820" cy="205" r="4"/>
  </g>

  <!-- the process tree that grows from one execution -->
  <g fill="none" stroke="#9fb0cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 205 V258 H596"/>
    <path d="M520 258 V300 H596"/>
    <path d="M596 300 H640 V342 H700"/>
    <path d="M700 342 V380 H760"/>
  </g>
  <g fill="#e6ecf7" filter="url(#softglow)">
    <circle cx="600" cy="258" r="5.5"/>
    <circle cx="600" cy="300" r="5.5"/>
    <circle cx="704" cy="342" r="5.5"/>
  </g>
  <!-- the node the hunt lit -->
  <circle cx="764" cy="380" r="16" fill="#ff4d6d" fill-opacity="0.35" filter="url(#haze)"/>
  <circle cx="764" cy="380" r="8" fill="#ff5c6c" filter="url(#glow)"/>
  <circle cx="764" cy="380" r="3" fill="#fff0f2"/>

  <!-- a second, quieter tree before the ring: what ran earlier -->
  <g fill="none" stroke="#3b4a68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 205 V160 H196"/>
    <path d="M150 160 V124 H196"/>
  </g>
  <g fill="#7d8ba6">
    <circle cx="200" cy="160" r="4"/>
    <circle cx="200" cy="124" r="4"/>
  </g>

  <!-- wordmark -->
  <text x="450" y="452" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="10" fill="url(#ember)" filter="url(#softglow)">CAAREA</text>
  <text x="450" y="494" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="2.5" fill="#aab8d0">every execution on a machine, in order</text>
</svg>
