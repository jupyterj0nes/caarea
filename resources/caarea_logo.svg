<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="870" viewBox="0 0 1024 870" role="img" aria-label="CAAREA: a carea leonés, the herding dog of León, in profile under a timeline of executions with a process tree branching from it">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0e1322"/>
      <stop offset="0.6" stop-color="#070a12"/>
      <stop offset="1" stop-color="#030408"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="0.5" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="emberD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.45" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1024" height="870" fill="url(#bg)"/>
  <ellipse cx="512" cy="540" rx="300" ry="220" fill="#ff7a45" fill-opacity="0.10" filter="url(#haze)"/>

  <!-- the timeline over the dog: executions as dots, one tree branching from one of them -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M70 240 H954" stroke="#58668a" stroke-width="3"/>
    <path d="M70 240 H400" stroke="url(#ember)" stroke-width="3.5" filter="url(#glow2)"/>
    <g stroke="#8fa0bf" stroke-width="3">
      <path d="M400 240 V180 H470"/>
      <path d="M400 180 V120 H470"/>
      <path d="M470 120 H520 V160 H590"/>
    </g>
    <g stroke="#3b4a68" stroke-width="2.5">
      <path d="M180 240 V290 H230"/>
      <path d="M700 240 V190 H760"/>
      <path d="M760 190 V150 H820"/>
    </g>
  </g>
  <g fill="#e6ecf7" filter="url(#glow2)">
    <circle cx="120" cy="240" r="6"/><circle cx="180" cy="240" r="5"/><circle cx="260" cy="240" r="7"/><circle cx="330" cy="240" r="5"/>
    <circle cx="474" cy="180" r="6"/><circle cx="474" cy="120" r="6"/>
    <circle cx="520" cy="240" r="6"/><circle cx="600" cy="240" r="5"/><circle cx="700" cy="240" r="7"/><circle cx="790" cy="240" r="5"/><circle cx="880" cy="240" r="6"/>
    <circle cx="234" cy="290" r="4.5"/><circle cx="764" cy="190" r="4.5"/><circle cx="824" cy="150" r="4.5"/>
  </g>
  <circle cx="400" cy="240" r="22" fill="#ff7a45" fill-opacity="0.35" filter="url(#haze)"/>
  <circle cx="400" cy="240" r="12" fill="url(#emberD)" filter="url(#glow)"/>
  <circle cx="400" cy="240" r="4.5" fill="#fff6e8"/>
  <circle cx="594" cy="160" r="16" fill="#ff3d7f" fill-opacity="0.35" filter="url(#haze)"/>
  <circle cx="594" cy="160" r="8" fill="#ff5c8a" filter="url(#glow)"/>
  <circle cx="594" cy="160" r="3" fill="#fff0f4"/>

  <!-- the carea: lean head in profile, facing left, alert; semi-erect ears, the tips leaning forward -->
  <g filter="url(#glow)">
    <!-- far ear, behind the skull -->
    <path fill="#05070d" stroke="url(#emberD)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"
      d="M622 406 C 636 372, 652 346, 672 328 C 682 320, 692 328, 690 342 C 684 368, 676 392, 668 418 Z"/>
    <!-- head, near ear and neck in one line -->
    <path fill="#05070d" stroke="url(#emberD)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
      d="M286 524
         C 292 508, 310 498, 334 494
         C 366 488, 396 480, 424 466
         C 436 448, 452 430, 474 418
         C 500 404, 526 394, 550 398
         C 556 366, 570 336, 590 314
         C 596 306, 604 304, 610 310
         C 622 338, 632 372, 636 408
         C 668 418, 694 444, 710 484
         C 722 518, 728 556, 736 596
         C 742 628, 748 660, 760 690
         L 742 684 L 748 708 L 728 700 L 732 722 L 710 712 L 712 734 L 690 724
         C 656 712, 624 706, 594 704
         C 556 700, 522 684, 492 658
         C 470 638, 454 614, 442 596
         C 420 584, 396 578, 370 574
         C 340 570, 312 564, 296 550
         C 286 542, 282 532, 286 524 Z"/>
    <!-- the inner edge of the near ear -->
    <path fill="none" stroke="url(#emberD)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"
      d="M572 396 C 578 366, 588 342, 602 322"/>
    <!-- mouth -->
    <path fill="none" stroke="url(#emberD)" stroke-width="6" stroke-linecap="round"
      d="M300 544 C 326 552, 352 558, 380 562 C 386 560, 390 556, 392 550"/>
    <!-- nose -->
    <path fill="url(#emberD)" d="M284 512 C 294 500, 314 500, 322 512 C 326 524, 316 536, 302 534 C 290 532, 280 522, 284 512 Z"/>
    <!-- eye -->
    <path fill="url(#emberD)" d="M452 462 C 466 448, 490 448, 502 462 C 490 474, 466 474, 452 462 Z"/>
    <circle cx="480" cy="461" r="4" fill="#05070d"/>
    <circle cx="486" cy="457" r="1.6" fill="#fff6e8"/>
    <!-- brow -->
    <path fill="none" stroke="url(#emberD)" stroke-width="5" stroke-linecap="round" d="M446 442 C 464 430, 490 428, 512 436"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="800" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="2" fill="url(#ember)" filter="url(#glow2)">caarea</text>
  <text x="512" y="842" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="1.5" fill="#c3cde0">what ran, when, as whom and from where</text>
</svg>
